apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-isolation
  namespace: quecto-ai
spec:
  podSelector:
    matchLabels:
      role: agent-container
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: quecto-platform
  egress:
    - to:
        - podSelector:
            matchLabels:
              role: mcp-server
      ports:
        - port: 9000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: ollama
      ports:
        - port: 11434
          protocol: TCP
