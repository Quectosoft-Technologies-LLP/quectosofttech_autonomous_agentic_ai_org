name: security
on:
  push:
    branches: [main]
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep
      - name: Bandit
        run: bandit -r src -q || true
      - name: Semgrep
        run: semgrep --config auto src || true
