apiVersion: v1
kind: ServiceAccount
metadata:
  name: quecto-platform-sa
  namespace: quecto-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quecto-platform-role
  namespace: quecto-ai
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quecto-platform-rb
  namespace: quecto-ai
subjects:
  - kind: ServiceAccount
    name: quecto-platform-sa
roleRef:
  kind: Role
  name: quecto-platform-role
  apiGroup: rbac.authorization.k8s.io
