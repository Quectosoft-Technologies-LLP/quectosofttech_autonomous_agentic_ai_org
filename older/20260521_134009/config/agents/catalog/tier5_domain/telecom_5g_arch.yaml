agent_id: telecom_5g_arch_agent
name: Telecom 5G Architecture Agent
tier: 5
department: telecom
role: >
  Deep domain specialist for telecom. Applies regulatory knowledge,
  domain standards, and compliance frameworks to agent outputs.
reports_to: vp_telecom_agent

model:
  default: hermes3:70b
  task_overrides:
    critical: claude-opus-4
    compliance: claude-opus-4

memory:
  agent_private: true
  team: true
  department: true
  project: true
  organisation_read: true
  organisation_write: false

workspace:
  isolated_container: true
  network_policy: strict
  read_only_fs: true
  max_memory_mb: 4096

raid_config:
  auto_mitigate_below: 5
  vp_review_from: 5
  csuite_gate_from: 10
  human_hitl_from: 15
  areas: [COMPLIANCE, SECURITY, REPUTATIONAL, BUDGET]

tools: [org_memory_mcp, project_memory_mcp, confluence_mcp, filesystem_mcp]
skills: [telecom_regulations, compliance_review, domain_documentation, audit_trail]
org_policies: [corporate_governance, telecom_compliance_policy]
